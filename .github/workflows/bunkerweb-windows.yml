# BunkerWeb for Windows - builds a native Windows installer from the bunkerweb submodule.
#
# The submodule (bunkerweb/) is never modified: every job copies bunkerweb/src to build/src and applies the
# Windows port there (.github/actions/prepare-src -> windows/build/patch-modsecurity.py + apply-windows-port.py).
#
#   modsecurity  libModSecurity.dll (MSVC 2022 + conan, ModSecurity's own build/win32)
#   native       nginx.exe + modules, LuaJIT, Lua C modules, runtime DLLs (MSYS2 UCRT64 / GCC)
#   python       private CPython + BunkerWeb Python dependencies
#   package      staged C:\bunkerweb tree + Inno Setup installer
#   smoke-test   installs the result on a clean runner and proxies a request through BunkerWeb
#   release      publishes the installer as a GitHub release named after the bunkerweb submodule version (main only):
#                smoke-test green -> release + tag v<version> (e.g. v1.6.17), the latest release, replaces the previous one;
#                smoke-test red   -> DRAFT release + tag v<version>-RC with installer and smoke-test logs, replaces only
#                the previous draft. The two kinds never touch each other.
#
# See windows/README.md for the architecture of the port.
#
# Build caches: modsecurity, native, python and package each cache their output (actions/cache restore + save) under a
# key made of the bunkerweb submodule commit, the files of this repository that influence that output and CACHE_VERSION.
# A run on an unchanged source restores the output and skips the build; the artifact for the next job is still uploaded.
# The cache is saved right after a successful build, so it survives a failing artifact upload, a failing later job
# (smoke-test) or a failing release. Only a failing or cancelled build itself leaves nothing behind (the conan
# packages of the ModSecurity build are saved even then). package caches the finished installer (dist/), so a failing
# smoke-test can be repeated without rebuilding it. smoke-test itself is never cached.
# The workflow file is not part of any key: bump CACHE_VERSION when you change how a job builds (not for smoke-test edits).
# Bump CACHE_VERSION to force fresh builds, e.g. when the runner image, the MSYS2 package list or an unpinned tool
# (conan, pywin32, ...) should be picked up anew. Caches live 7 days without use and are shared between runs of the
# same branch and the default branch.

name: BunkerWeb for Windows

on:
  workflow_dispatch:
    inputs:
      port_revision:
        description: Port revision (installer version suffix -win<N>)
        required: false
        default: "1"
  push:
    branches: [main]

    paths:
      - "windows/**"
      - "bunkerweb"
      - ".gitmodules"
      - ".github/workflows/bunkerweb-windows.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "windows/**"
      - "bunkerweb"
      - ".gitmodules"
      - ".github/workflows/bunkerweb-windows.yml"
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: bunkerweb-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  # Part of every build-cache key: bump it to invalidate all caches
  CACHE_VERSION: "1"
  # BunkerWeb's Linux packages use Python 3.14; change here if a dependency has no wheel for it yet
  PYTHON_VERSION: "3.14"
  BUSYBOX_URL: https://frippery.org/files/busybox/busybox-w64-FRP-6354-g5f09fb446.exe
  BUSYBOX_SHA256: 95343c871869cc0ab57ecec26b2f9af0370eb9c954f7e5ddd017163e4e0d09a0
  # frippery.org answers 403 to GitHub's runners at times. The Chocolatey package for the same release carries the
  # identical binary as tools/busybox64.exe (same SHA-256), so it is used as the fallback.
  BUSYBOX_FALLBACK_URL: https://community.chocolatey.org/api/v2/package/busybox/6354.0.0
  BUSYBOX_FALLBACK_MEMBER: tools/busybox64.exe
  WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET461.exe
  WINSW_SHA256: b5066b7bbdfba1293e5d15cda3caaea88fbeab35bd5b38c41c913d492aadfc4f

jobs:
  # ------------------------------------------------------------------------------------------ ModSecurity (MSVC)
  modsecurity:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Git settings (keep LF, allow long paths)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache key (bunkerweb submodule commit)
        id: src
        run: |
          $sha = (git rev-parse HEAD:bunkerweb).Trim()
          "bunkerweb=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "bunkerweb submodule commit: $sha"

      - name: Restore libModSecurity from the build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/modsecurity
          key: modsecurity-v${{ env.CACHE_VERSION }}-${{ steps.src.outputs.bunkerweb }}-${{ hashFiles('windows/build/patch-modsecurity.py', 'windows/build/build-modsecurity.ps1', '.github/actions/prepare-src/action.yml') }}

      - uses: actions/setup-python@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ./.github/actions/prepare-src
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          scope: modsecurity

      - name: Install conan
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m pip install --upgrade "conan>=2.27.1,<3"

      # restore here, save explicitly right after the build (below): the save must not depend on the later
      # steps of this job (artifact upload) succeeding
      - name: Restore conan packages
        id: conan
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.conan2/p
          key: conan-msvc2022-${{ hashFiles('bunkerweb/src/deps/src/modsecurity/build/win32/conanfile.txt') }}

      - name: Build libModSecurity.dll
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./windows/build/build-modsecurity.ps1 -Src build/src -Out build/modsecurity

      - name: Save libModSecurity to the build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/modsecurity
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # Compiling the conan dependencies takes about 20 minutes, so keep them even if the build step fails later
      - name: Save conan packages
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' && steps.conan.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: modsecurity
          path: build/modsecurity
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------------------------ nginx & co (MSYS2 UCRT64)
  native:
    needs: modsecurity
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Git settings (keep LF, allow long paths)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Cache key (bunkerweb submodule commit)
        id: src
        run: |
          $sha = (git rev-parse HEAD:bunkerweb).Trim()
          "bunkerweb=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "bunkerweb submodule commit: $sha"

      # nginx links against libModSecurity, so the key also covers everything the modsecurity job depends on
      - name: Restore nginx and the Lua modules from the build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/native
          key: native-v${{ env.CACHE_VERSION }}-${{ steps.src.outputs.bunkerweb }}-${{ hashFiles('windows/build/apply-windows-port.py', 'windows/build/patch-modsecurity.py', 'windows/build/build-modsecurity.ps1', 'windows/build/build-native.sh', 'windows/overlay/src/**', '.github/actions/prepare-src/action.yml') }}

      - uses: actions/setup-python@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ./.github/actions/prepare-src
        if: steps.cache.outputs.cache-hit != 'true'

      - uses: actions/download-artifact@v8
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: modsecurity
          path: build/modsecurity

      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-tools-git
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libgd
            mingw-w64-ucrt-x86_64-libmaxminddb
            mingw-w64-ucrt-x86_64-file
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Build nginx, LuaJIT and Lua modules
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash windows/build/build-native.sh build/src build/modsecurity build/native

      - name: Save nginx and the Lua modules to the build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/native
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: native
          path: build/native
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------------------------ Python runtime
  python:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Git settings (keep LF, allow long paths)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache key (bunkerweb submodule commit)
        id: src
        run: |
          $sha = (git rev-parse HEAD:bunkerweb).Trim()
          "bunkerweb=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "bunkerweb submodule commit: $sha"

      # the output contains a copy of the runner's CPython, so the exact patch version is part of the key
      - name: Restore the Python runtime from the build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: build/python
          key: python-v${{ env.CACHE_VERSION }}-${{ steps.py.outputs.python-version }}-${{ steps.src.outputs.bunkerweb }}-${{ hashFiles('windows/build/build-python.ps1', 'windows/build/prepare-requirements.py', 'windows/overlay/python-site/**') }}

      - uses: ./.github/actions/prepare-src
        if: steps.cache.outputs.cache-hit != 'true'

      # Rust (rustup) is preinstalled on the runner, in case a dependency has no wheel for this Python
      - name: Build the Python runtime and dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./windows/build/build-python.ps1 -Src build/src -Windows windows -Out build/python

      - name: Save the Python runtime to the build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/python
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: build/python
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------------------------------------ installer
  package:
    needs: [native, python]
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Git settings (keep LF, allow long paths)
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Version
        id: version
        env:
          INPUT_REVISION: ${{ inputs.port_revision }}
        run: |
          $version = (Get-Content bunkerweb/src/VERSION -Raw).Trim()
          $revision = '1'
          if ($env:INPUT_REVISION) {
            if ($env:INPUT_REVISION -notmatch '^\d+$') { throw "port_revision must be a number" }
            $revision = $env:INPUT_REVISION
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
          Write-Host "BunkerWeb $version, Windows port revision $revision"
          $sha = (git rev-parse HEAD:bunkerweb).Trim()
          "bunkerweb=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "bunkerweb submodule commit: $sha"

      # The installer embeds the revision, everything under windows/ (build scripts, overlay, installer script, service
      # definitions) and the pinned tools. The native and python outputs are covered by the same inputs. Changing the
      # package/smoke-test steps of this workflow does not invalidate it: bump CACHE_VERSION if the way the installer
      # is built (stage/ISCC invocation, tool downloads) changes.
      - name: Restore the installer from the build cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: package-v${{ env.CACHE_VERSION }}-${{ steps.version.outputs.version }}-win${{ steps.version.outputs.revision }}-${{ steps.version.outputs.bunkerweb }}-py${{ steps.py.outputs.python-version }}-${{ env.BUSYBOX_SHA256 }}-${{ env.WINSW_SHA256 }}-${{ hashFiles('windows/**', '.github/actions/**') }}

      - uses: ./.github/actions/prepare-src
        if: steps.cache.outputs.cache-hit != 'true'

      - uses: actions/download-artifact@v8
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: native
          path: build/native

      - uses: actions/download-artifact@v8
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: python
          path: build/python

      - name: Download busybox-w32 and WinSW (pinned by SHA-256)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force build/tools | Out-Null

          function Get-Sha256([string] $File) { (Get-FileHash -Algorithm SHA256 $File).Hash.ToLowerInvariant() }

          function Get-Pinned {
            param([string] $Url, [string] $File, [string] $Sha, [string] $ZipMember)
            Invoke-WebRequest -Uri $Url -OutFile $File -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 5
            if ($ZipMember) {
              # the download is a zip/nupkg: take one member out of it
              $zip = "$File.zip"
              Move-Item -Force $File $zip
              $tmp = "$File.extract"
              Expand-Archive -Path $zip -DestinationPath $tmp -Force
              Move-Item -Force (Join-Path $tmp $ZipMember) $File
              Remove-Item -Recurse -Force $zip, $tmp
            }
            $hash = Get-Sha256 $File
            if ($hash -ne $Sha) { Remove-Item -Force $File; throw "Checksum mismatch for ${Url}: $hash" }
          }

          $busybox = 'build/tools/busybox.exe'
          try {
            Get-Pinned -Url $env:BUSYBOX_URL -File $busybox -Sha $env:BUSYBOX_SHA256
          } catch {
            Write-Host "::warning::busybox download from $env:BUSYBOX_URL failed ($($_.Exception.Message)), using the fallback"
            Get-Pinned -Url $env:BUSYBOX_FALLBACK_URL -File $busybox -Sha $env:BUSYBOX_SHA256 -ZipMember $env:BUSYBOX_FALLBACK_MEMBER
          }
          Write-Host "${busybox}: $(Get-Sha256 $busybox)"

          $winsw = 'build/tools/WinSW.exe'
          Get-Pinned -Url $env:WINSW_URL -File $winsw -Sha $env:WINSW_SHA256
          Write-Host "${winsw}: $(Get-Sha256 $winsw)"

      - name: Stage the C:\bunkerweb tree
        if: steps.cache.outputs.cache-hit != 'true'
        run: >-
          ./windows/build/stage.ps1
          -Repo bunkerweb
          -Src build/src
          -Windows windows
          -Native build/native
          -Python build/python
          -Busybox build/tools/busybox.exe
          -WinSW build/tools/WinSW.exe
          -Out build/stage

      - name: Build the installer (Inno Setup 6)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          $root = (Get-Location).Path
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DPortRevision=${{ steps.version.outputs.revision }}" `
            "/DStageDir=$root\build\stage" `
            "/DLicenseFile=$root\bunkerweb\LICENSE.md" `
            "/DOutputDir=$root\dist" `
            "$root\windows\installer\bunkerweb.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Push-Location dist
          Get-ChildItem *.exe | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Save the installer to the build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist
          if-no-files-found: error
          compression-level: 0

      # the staged tree is handy to inspect a build without installing it (not available when the installer
      # came from the build cache)
      - uses: actions/upload-artifact@v7
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: stage
          path: build/stage
          retention-days: 5

  # ------------------------------------------------------------------------------------------ smoke test
  smoke-test:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      SITE: app.smoke.test
      MARKER: bunkerweb-windows-smoke-ok
      UA: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No port number is assumed anywhere in this job: every port (BunkerWeb's and the backend's) is picked here
      # and handed to the following steps as an environment variable.
      - name: Pick free TCP ports
        run: |
          # random ports below the Windows dynamic range (49152+); each one is test-bound on all interfaces
          $picked = [System.Collections.Generic.List[int]]::new()
          function Get-FreePort {
            for ($i = 0; $i -lt 500; $i++) {
              $port = Get-Random -Minimum 20000 -Maximum 30000
              if ($picked.Contains($port)) { continue }
              $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, $port)
              try {
                $listener.Start()
                $listener.Stop()
                $picked.Add($port)
                return $port
              } catch { Write-Host "port $port is not usable: $($_.Exception.Message)" }
            }
            throw 'No free TCP port found'
          }
          foreach ($name in 'BW_HTTP_PORT', 'BW_HTTPS_PORT', 'BW_UI_PORT', 'BW_API_PORT', 'BW_HEALTH_PORT', 'BACKEND_PORT') {
            $port = Get-FreePort
            Write-Host "$name=$port"
            "$name=$port" | Add-Content -Encoding ascii $env:GITHUB_ENV
          }

      - name: Start a test backend on a free port (127.0.0.1)
        run: |
          New-Item -ItemType Directory -Force C:\smoke-backend | Out-Null
          Set-Content -Encoding ascii C:\smoke-backend\index.html $env:MARKER
          Start-Process -WindowStyle Hidden -FilePath (Get-Command python).Source `
            -ArgumentList '-m', 'http.server', $env:BACKEND_PORT, '--bind', '127.0.0.1', '--directory', 'C:\smoke-backend'
          Start-Sleep -Seconds 2
          (Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$env:BACKEND_PORT/").Content

      - name: Pre-seed C:\bunkerweb\etc\bunkerweb\variables.env (configuration as code)
        run: |
          New-Item -ItemType Directory -Force C:\bunkerweb\etc\bunkerweb | Out-Null
          @(
            "SERVER_NAME=$env:SITE"
            'MULTISITE=yes'
            'WORKER_PROCESSES=1'
            "HTTP_PORT=$env:BW_HTTP_PORT"
            "HTTPS_PORT=$env:BW_HTTPS_PORT"
            'API_LISTEN_IP=127.0.0.1'
            "API_HTTP_PORT=$env:BW_API_PORT"
            "HEALTHCHECK_PORT=$env:BW_HEALTH_PORT"
            "UI_HOST=http://127.0.0.1:$env:BW_UI_PORT"
            'USE_BUNKERNET=no'
            'SEND_ANONYMOUS_REPORT=no'
            "${env:SITE}_USE_REVERSE_PROXY=yes"
            "${env:SITE}_REVERSE_PROXY_URL=/"
            "${env:SITE}_REVERSE_PROXY_HOST=http://127.0.0.1:$env:BACKEND_PORT"
          ) | Set-Content -Encoding ascii C:\bunkerweb\etc\bunkerweb\variables.env
          Get-Content C:\bunkerweb\etc\bunkerweb\variables.env

      - name: Install (silent)
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name)"
          $p = Start-Process -Wait -PassThru -FilePath $setup.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=C:\bunkerweb-setup.log', '/TASKS="startservices,webui,firewall"'
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit code $($p.ExitCode)" }
          Get-Service bunkerweb-* | Format-Table Name, Status, StartType

      - name: Nothing is installed outside C:\bunkerweb
        run: |
          foreach ($d in 'C:\usr', 'C:\etc', 'C:\var', 'C:\tmp') {
            if (Test-Path $d) { throw "$d exists, BunkerWeb must only use C:\bunkerweb" }
          }
          foreach ($d in 'usr\sbin\nginx.exe', 'etc\bunkerweb\variables.env', 'var\log\bunkerweb') {
            if (-not (Test-Path "C:\bunkerweb\$d")) { throw "C:\bunkerweb\$d is missing" }
          }

      - name: Busybox applets used by BunkerWeb are available
        run: |
          # pushswap.lua, api.lua and the scheduler shell out to these (tar for the /confs push, uname for bunkernet)
          $bb = 'C:\bunkerweb\usr\bin\busybox.exe'
          $applets = (& $bb --list) -split "`r?`n"
          $missing = 'sh', 'tar', 'gzip', 'find', 'ls', 'cp', 'rm', 'mkdir', 'test', 'uname', 'mv', 'cat' | Where-Object { $applets -notcontains $_ }
          if ($missing) { throw "busybox lacks applets: $($missing -join ', ')" }
          & $bb uname -m

      - name: Services are running and nginx is healthy
        run: |
          # Fail fast: the services have onfailure=restart (10/30/60 s), so a crash-looping service looks "fine" most of the time
          # and the old 3 minute wait just hid it. Fail on the first restart (a new WinSW process / a second "Started" line in the
          # wrapper log) or when a service stays Stopped, and print the tail of the service logs right here.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $services = 'bunkerweb-nginx', 'bunkerweb-scheduler', 'bunkerweb-ui'
          $logDir = 'C:\bunkerweb\var\log\bunkerweb\service'
          $firstPid = @{}
          $stopped = @{}
          function Fail-Fast([string]$msg) {
            foreach ($s in $services) {
              foreach ($f in Get-ChildItem $logDir -Filter "$s*" -File -ErrorAction SilentlyContinue) {
                Write-Host "::group::$($f.Name) (last 60 lines)"
                if ($f.Length -eq 0) { Write-Host '(empty)' } else { Get-Content -LiteralPath $f.FullName -Tail 60 -Encoding utf8 }
                Write-Host '::endgroup::'
              }
            }
            throw "$msg (full logs: step 'Diagnostics (service and BunkerWeb logs)')"
          }
          function Test-Services {
            foreach ($s in $services) {
              $cim = Get-CimInstance Win32_Service -Filter "Name='$s'"
              if (-not $cim) { Fail-Fast "$s is not installed" }
              if ($cim.State -eq 'Stopped') {
                $stopped[$s] = 1 + [int]$stopped[$s]
                if ($stopped[$s] -ge 2) { Fail-Fast "$s is Stopped (exited, WinSW will only retry after its delay)" }
              } else { $stopped[$s] = 0 }
              if ($cim.ProcessId -gt 0) {
                if (-not $firstPid.ContainsKey($s)) { $firstPid[$s] = $cim.ProcessId }
                elseif ($firstPid[$s] -ne $cim.ProcessId) { Fail-Fast "$s was restarted by WinSW (process $($firstPid[$s]) -> $($cim.ProcessId))" }
              }
              $wrapperLog = Join-Path $logDir "$s.wrapper.log"
              if (Test-Path $wrapperLog) {
                $starts = @(Select-String -LiteralPath $wrapperLog -Pattern 'Started (process )?\d+').Count
                if ($starts -gt 1) { Fail-Fast "$s was started $starts times (it crashed and WinSW restarted it)" }
              }
            }
          }
          Test-Services
          $deadline = (Get-Date).AddMinutes(3)
          $healthy = $false
          do {
            Test-Services
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Headers @{ Host = 'healthcheck.bunkerweb.io' } "http://127.0.0.1:$env:BW_HEALTH_PORT/healthz"
              Write-Host "healthz: $($r.Content.Trim())"
              if ($r.Content.Trim() -eq 'ok') { $healthy = $true; break }
            } catch { Write-Host "healthz: $($_.Exception.Message)" }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if (-not $healthy) { Fail-Fast 'nginx did not become healthy within 3 minutes' }

      - name: Windows Firewall rule and listeners use the configured ports
        run: |
          $rulePorts = Get-NetFirewallRule -Group BunkerWeb | Get-NetFirewallPortFilter | ForEach-Object { $_.LocalPort }
          Write-Host "Firewall rule ports: $($rulePorts -join ', ')"
          foreach ($p in $env:BW_HTTP_PORT, $env:BW_HTTPS_PORT) {
            if ($p -notin $rulePorts) { throw "Firewall rule does not allow TCP $p" }
          }
          if ($rulePorts -contains '80' -or $rulePorts -contains '443') { throw 'Firewall rule still contains the default ports 80/443' }
          $listening = Get-NetTCPConnection -State Listen | ForEach-Object { [string]$_.LocalPort } | Sort-Object -Unique
          foreach ($name in 'BW_HTTP_PORT', 'BW_HTTPS_PORT', 'BW_UI_PORT', 'BW_API_PORT', 'BW_HEALTH_PORT') {
            $p = [Environment]::GetEnvironmentVariable($name)
            if ($p -notin $listening) { throw "Nothing listens on $name=$p" }
            Write-Host "$name=$p is listening"
          }

      - name: Reverse proxy to the backend works
        run: |
          $deadline = (Get-Date).AddMinutes(5)
          $ok = $false
          do {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck -UserAgent $env:UA -Headers @{ Host = $env:SITE } "http://127.0.0.1:$env:BW_HTTP_PORT/"
              $body = "$($r.Content)".Trim()
              Write-Host "HTTP $($r.StatusCode): $($body.Substring(0, [Math]::Min(120, $body.Length)))"
              if ($r.StatusCode -eq 200 -and $body -like "*$env:MARKER*") { $ok = $true; break }
            } catch { Write-Host $_.Exception.Message }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          if (-not $ok) { throw "No proxied response from $env:SITE within 5 minutes" }
          Write-Host 'Response headers:'
          $r.Headers.GetEnumerator() | ForEach-Object { "  $($_.Key): $($_.Value)" }

      - name: Unknown hosts are rejected by the default server
        run: |
          $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck -UserAgent $env:UA -Headers @{ Host = 'unknown.smoke.test' } "http://127.0.0.1:$env:BW_HTTP_PORT/"
          Write-Host "HTTP $($r.StatusCode)"
          if ($r.StatusCode -eq 200 -and "$($r.Content)" -like "*$env:MARKER*") { throw 'The default server proxied an unknown host' }

      - name: bwctl status / test / reload / reload-scheduler
        run: |
          C:\bunkerweb\usr\bin\bwctl.cmd status
          if ($LASTEXITCODE -ne 0) { throw 'bwctl status failed' }
          C:\bunkerweb\usr\bin\bwctl.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'bwctl test (nginx -t) failed' }
          C:\bunkerweb\usr\bin\bwctl.cmd reload
          if ($LASTEXITCODE -ne 0) { throw 'bwctl reload failed' }
          C:\bunkerweb\usr\bin\bwctl.cmd reload-scheduler
          if ($LASTEXITCODE -ne 0) { throw 'bwctl reload-scheduler failed' }
          Start-Sleep -Seconds 30
          $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck -UserAgent $env:UA -Headers @{ Host = $env:SITE } "http://127.0.0.1:$env:BW_HTTP_PORT/"
          if ($r.StatusCode -ne 200) { throw "Site broken after reload (HTTP $($r.StatusCode))" }

      - name: Web UI answers on its configured port
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          $code = 0
          do {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck -MaximumRedirection 0 "http://127.0.0.1:$env:BW_UI_PORT/"
              $code = [int]$r.StatusCode
              Write-Host "UI: HTTP $code"
            } catch { Write-Host "UI: $($_.Exception.Message)" }
            if ($code -ge 200 -and $code -lt 500) { break }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if (-not ($code -ge 200 -and $code -lt 500)) { throw 'The web UI did not answer' }

      - name: Restart survives (stop/start of all services)
        run: |
          C:\bunkerweb\usr\bin\bwctl.cmd restart
          if ($LASTEXITCODE -ne 0) { throw 'bwctl restart failed' }
          Start-Sleep -Seconds 20
          $deadline = (Get-Date).AddMinutes(3)
          $code = 0
          do {
            try {
              $code = [int](Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 -SkipHttpErrorCheck -UserAgent $env:UA -Headers @{ Host = $env:SITE } "http://127.0.0.1:$env:BW_HTTP_PORT/").StatusCode
              Write-Host "HTTP $code"
            } catch { Write-Host $_.Exception.Message }
            if ($code -eq 200) { break }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if ($code -ne 200) { throw 'Site not served after a restart' }

      # Everything the services wrote, straight into the run log (one collapsible group per file, service wrapper/stdout/stderr
      # first), so a failure can be analysed without downloading the smoke-test-logs artifact.
      - name: Diagnostics (service and BunkerWeb logs)
        if: always()
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host '::group::Services'
          Get-Service bunkerweb-* -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType
          Write-Host '::endgroup::'
          Write-Host '::group::Listening ports'
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object LocalPort -in $env:BW_HTTP_PORT, $env:BW_HTTPS_PORT, $env:BW_UI_PORT, $env:BW_API_PORT, $env:BW_HEALTH_PORT, $env:BACKEND_PORT, 80, 443, 5000, 6000, 7000, 8888 | Format-Table LocalAddress, LocalPort, OwningProcess
          Write-Host '::endgroup::'
          if (Test-Path C:\bunkerweb\etc\nginx) {
            Write-Host '::group::Generated nginx configuration (C:\bunkerweb\etc\nginx)'
            Get-ChildItem C:\bunkerweb\etc\nginx -Recurse -File | ForEach-Object { '{0,8}  {1}' -f $_.Length, $_.FullName.Substring(3) }
            Write-Host '::endgroup::'
          }
          $logRoot = 'C:\bunkerweb\var\log\bunkerweb'
          $files = @(Get-ChildItem $logRoot -Recurse -File -ErrorAction SilentlyContinue)
          # service logs (WinSW wrapper, stdout, stderr) first, then BunkerWeb's own logs
          $files = @($files | Where-Object { $_.DirectoryName -like '*\service' }) + @($files | Where-Object { $_.DirectoryName -notlike '*\service' })
          foreach ($f in $files) {
            Write-Host "::group::$($f.FullName) ($($f.Length) bytes)"
            if ($f.Length -eq 0) { Write-Host '(empty)' }
            else { Get-Content -LiteralPath $f.FullName -Tail 400 -Encoding utf8 }
            Write-Host '::endgroup::'
          }
          if (Test-Path C:\bunkerweb-setup.log) {
            Write-Host '::group::Installer log (C:\bunkerweb-setup.log, errors and [Run] entries only)'
            Get-Content C:\bunkerweb-setup.log | Where-Object { $_ -match 'powershell|bwctl|Exception|[Ff]ailed|[Ee]rror|exit code|Running' -and $_ -notmatch 'Successfully installed the file' } | Select-Object -Last 80
            Write-Host '::endgroup::'
          }

      - name: Collect logs and generated configuration
        if: always()
        run: |
          New-Item -ItemType Directory -Force C:\smoke-artifacts | Out-Null
          foreach ($p in 'C:\bunkerweb\var\log\bunkerweb', 'C:\bunkerweb\etc\nginx', 'C:\bunkerweb-setup.log', 'C:\bunkerweb\etc\bunkerweb\variables.env') {
            if (Test-Path $p) { Copy-Item -Recurse -Force $p C:\smoke-artifacts\ }
          }
          Get-ChildItem C:\bunkerweb\var\tmp\bunkerweb -Filter *.error -ErrorAction SilentlyContinue | Copy-Item -Destination C:\smoke-artifacts\

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test-logs
          path: C:\smoke-artifacts
          retention-days: 14

      - name: Uninstall
        run: |
          $uninstaller = 'C:\ProgramData\BunkerWeb\uninstall\unins000.exe'
          Start-Process -Wait -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # the uninstaller relaunches itself from %TEMP%, wait for the real work to finish
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Service bunkerweb-* -ErrorAction SilentlyContinue) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (Get-Service bunkerweb-* -ErrorAction SilentlyContinue) { throw 'Services still registered after uninstall' }
          if (-not (Test-Path C:\bunkerweb\etc\bunkerweb\variables.env)) { throw 'Configuration was removed by the uninstaller' }
          Write-Host 'Uninstalled, configuration kept.'

  # ------------------------------------------------------------------------------------------ release
  # Runs on main (push or manual dispatch) after a smoke test that either passed or failed (not when it was skipped or
  # cancelled):
  #   passed -> release   tag v<bunkerweb version>      (the latest release)
  #   failed -> draft     tag v<bunkerweb version>-RC  (installer + smoke-test logs)
  # The previous release of the same kind (same tag AND same draft state) is deleted first, together with its tag and
  # assets, so each kind always has exactly one current release. A draft never touches the real release and vice versa.
  # The tag is recreated on the commit that was built (the release API creates it from target_commitish).
  release:
    if: >-
      ${{ always()
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.package.result == 'success'
      && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'failure') }}
    needs: [package, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # delete + create must not be interrupted or interleaved by another run
    concurrency:
      group: bunkerweb-windows-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.package.outputs.version }}
      REVISION: ${{ needs.package.outputs.revision }}
      SMOKE_RESULT: ${{ needs.smoke-test.result }}
    steps:
      - name: Name the release
        id: names
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SMOKE_RESULT" = success ]; then
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "name=BunkerWeb ${VERSION} for Windows" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}-RC" >> "$GITHUB_OUTPUT"
            echo "name=BunkerWeb ${VERSION}-RC for Windows" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      # the logs artifact is uploaded even when the smoke test fails; release assets must be single files
      - uses: actions/download-artifact@v8
        if: steps.names.outputs.draft == 'true'
        continue-on-error: true
        with:
          name: smoke-test-logs
          path: smoke-test-logs

      - name: Pack the smoke-test logs
        if: steps.names.outputs.draft == 'true'
        shell: bash
        run: |
          if [ -d smoke-test-logs ] && [ -n "$(ls -A smoke-test-logs)" ]; then
            (cd smoke-test-logs && zip -qr ../dist/smoke-test-logs.zip .)
          fi
          ls -l dist

      - name: Remove the previous release of the same kind
        shell: bash
        env:
          TAG: ${{ steps.names.outputs.tag }}
          DRAFT: ${{ steps.names.outputs.draft }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
            | jq -r --arg tag "$TAG" --argjson draft "$DRAFT" '.[] | select(.tag_name == $tag and .draft == $draft) | .id' \
            | while read -r id; do
                echo "Deleting release $id ($TAG, draft=$DRAFT)"
                gh api -X DELETE "repos/${GH_REPO}/releases/${id}"
              done
          # a leftover tag would keep pointing at an older commit; it does not exist when no such release was published
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" 2>/dev/null && echo "Deleted tag $TAG" || true

      - name: Write the release notes
        shell: bash
        env:
          DRAFT: ${{ steps.names.outputs.draft }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ "$DRAFT" = true ]; then
              echo "**RELEASE CANDIDATE - the smoke test FAILED. Do not use this on a production server.** Logs: [workflow run]($RUN_URL), \`smoke-test-logs.zip\`."
              echo
            fi
            echo "**BunkerWeb ${VERSION} for Windows** (port revision ${REVISION}) - native Windows services, no containers."
            echo
            echo "This is an **unofficial** port, it is not supported by Bunkerity. BunkerWeb is licensed under the AGPLv3;"
            echo "the complete corresponding source is this repository at the commit of this release (Windows port in \`windows/\`)"
            echo "together with the \`bunkerweb\` submodule commit it references."
            echo
            echo "Installation and configuration: see \`README.md\`."
          } > release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.names.outputs.tag }}
          name: ${{ steps.names.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.names.outputs.draft == 'true' }}
          prerelease: false
          make_latest: ${{ steps.names.outputs.draft != 'true' }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/smoke-test-logs.zip
