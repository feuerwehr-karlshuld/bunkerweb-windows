# Fast checks of the Windows port (about a minute, ubuntu, no build): does the port still apply to BunkerWeb and leave
# valid files behind? What the real pipeline (bunkerweb-windows.yml) finds after 30+ minutes on Windows, this finds first.
#
#   check            every push / pull request: unit tests, patch series lint, apply the port to the pinned submodule,
#                    syntax checks of every changed file, hazard scan against windows/build/hazards.baseline.txt
#   upstream-watch   nightly and on demand: the same against the newest BunkerWeb release (or `upstream_ref`) without
#                    touching the pinned submodule in the repository; opens/updates an issue when it no longer applies
#
# Nothing here proves the port *runs*: that is still the smoke test of the main pipeline.

name: Port check

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: BunkerWeb tag to check in the upstream-watch job (empty = latest release)
        required: false
        default: ""

concurrency:
  group: port-check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  BW_REQUIRE_LUPA: "1"

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: python -m pip install lupa jinja2

      - name: Port check (pinned BunkerWeb submodule)
        run: bash windows/build/port-check.sh

  upstream-watch:
    # Scheduled runs only; a manual run also works (workflow_dispatch) to check a given tag.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: python -m pip install lupa jinja2

      - name: Select the upstream version
        id: upstream
        env:
          REQUESTED: ${{ inputs.upstream_ref }}
        run: |
          pinned="v$(tr -d '[:space:]' < bunkerweb/src/VERSION)"
          if [ -n "$REQUESTED" ]; then
            tag="$REQUESTED"
          else
            tag="$(gh api repos/bunkerity/bunkerweb/releases/latest --jq .tag_name)"
          fi
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Pinned: $pinned, checking: $tag"

      - name: Check out that upstream version into the submodule (this runner only)
        if: steps.upstream.outputs.tag != steps.upstream.outputs.pinned
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          tag="$TAG"
          git -C bunkerweb fetch --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          git -C bunkerweb checkout --detach "refs/tags/${tag}"
          echo "BunkerWeb $(tr -d '[:space:]' < bunkerweb/src/VERSION) checked out"

      - name: Port check
        id: check
        run: bash windows/build/port-check.sh 2>&1 | tee port-check.log; exit "${PIPESTATUS[0]}"

      - name: Report a port that no longer applies
        if: failure() && steps.check.outcome == 'failure' && steps.upstream.outputs.tag != steps.upstream.outputs.pinned
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
        run: |
          tag="$TAG"
          title="Windows port does not apply to BunkerWeb ${tag}"
          {
            echo "The nightly **Port check** against upstream \`${tag}\` (pinned: \`${PINNED}\`) failed."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Next step: follow *Upgrading BunkerWeb* in \`windows/README.md\` (\`python windows/build/patchtool.py import --rev ${tag}\`)."
            echo
            echo '<details><summary>Log (last 120 lines)</summary>'
            echo
            echo '```'
            tail -n 120 port-check.log
            echo '```'
            echo '</details>'
          } > issue.md
          gh label create upstream-update --color 0e8a16 --description "Upstream BunkerWeb release needs port work" 2>/dev/null || true
          existing="$(gh issue list --state open --label upstream-update --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh issue create --title "$title" --label upstream-update --body-file issue.md
          fi
